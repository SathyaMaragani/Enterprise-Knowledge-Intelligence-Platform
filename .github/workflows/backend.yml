# Tests the backend against real PostgreSQL, MongoDB and Qdrant. Deployment is
# Render's: render.yaml deploys a commit only after these checks pass
# (subjects/DBE-DSD/deploy/README.md).
name: Backend

on:
  push:
    branches: [main]
    paths:
      - subjects/DBE-DSD/backend/**
      - subjects/DBE-DSD/database/**
      - subjects/DSA-3/**
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - subjects/DBE-DSD/backend/**
      - subjects/DBE-DSD/database/**
      - subjects/DSA-3/**
      - .github/workflows/backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: TextHack suites (DSA-3)
        run: sh subjects/DSA-3/run-tests.sh

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: models/minilm
          key: minilm-${{ hashFiles('subjects/DBE-DSD/backend/model/fetch-model.sh') }}

      - name: Fetch the embedding model
        run: sh subjects/DBE-DSD/backend/model/fetch-model.sh models/minilm

      - name: Start the test databases
        run: docker compose -f subjects/DBE-DSD/database/docker-compose.test.yml up -d --wait

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Seed Qdrant
        env:
          QDRANT_HTTP_PORT: '6343'
        run: |
          pip install qdrant-client==1.19.0
          python subjects/DBE-DSD/database/qdrant/seed/seed_vectors.py

      # DemoSemanticSearchIntegrationTest needs the separate demo stack with its
      # 705 ingested vectors; it runs locally (see backend/docs/TESTING.md).
      - name: Backend tests
        working-directory: subjects/DBE-DSD/backend
        run: ./mvnw -B test -Duser.timezone=UTC "-Dtest=!DemoSemanticSearchIntegrationTest" -Dsurefire.failIfNoSpecifiedTests=false
