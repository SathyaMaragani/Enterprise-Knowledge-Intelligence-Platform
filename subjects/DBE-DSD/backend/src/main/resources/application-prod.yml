# Production profile, switched on by SPRING_PROFILES_ACTIVE=prod (the render
# image sets it). Connection details still come from the environment; see
# subjects/DBE-DSD/deploy/README.md.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      # 0.1 CPU cannot use more; each idle connection still costs memory.
      maximum-pool-size: 4

server:
  tomcat:
    threads:
      # Every request thread can hold an ONNX encode; 200 of them would not fit in 512 MB.
      max: 16

management:
  endpoint:
    health:
      # /actuator/health is public; component details would describe the databases.
      show-details: never
