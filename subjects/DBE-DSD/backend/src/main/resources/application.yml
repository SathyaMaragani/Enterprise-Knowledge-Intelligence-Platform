spring:
  application:
    name: enterprise-knowledge-intelligence-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eip_db}
    username: ${DB_USERNAME:eip_dev}
    password: ${DB_PASSWORD:dev_pass_123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:eip_mongo_user}:${MONGO_PASSWORD:mongo_pass_123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:eip_doc_db}?authSource=admin

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  api-key: ${QDRANT_API_KEY:}
  collection-name: ${QDRANT_COLLECTION:knowledge_chunks}
  vector-dimension: ${QDRANT_VECTOR_DIMENSION:384}
  use-tls: ${QDRANT_USE_TLS:false}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
