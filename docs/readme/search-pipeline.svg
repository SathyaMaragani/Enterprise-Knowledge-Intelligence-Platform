', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">• Aho-Corasick: all terms</text><text x="262.0" y="180.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">• Damerau-Levenshtein: typos</text><rect x="252.5" y="222.0" width="235.0" height="155.5" rx="10" fill="#0F172A" opacity="0.08"/><rect x="250.0" y="218.5" width="235.0" height="155.5" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/><path d="M250,254.0 V228.5 Q250,218.5 260,218.5 H475 Q485,218.5 485,228.5 V254.0 Z" fill="url(#g3)" stroke="#E11D48" stroke-width="0.1" stroke-linejoin="round" stroke-linecap="round"/><text x="262.0" y="243.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">Vector leg</text><rect x="257.0" y="264.8" width="221.0" height="16.5" rx="3" fill="#FEF9C3"/><text x="262.0" y="277.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" font-weight="bold" xml:space="preserve">Modes: semantic, hybrid</text><text x="262.0" y="294.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">MiniLM (ONNX) embeds the query,</text><text x="262.0" y="311.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">384-d</text><text x="262.0" y="328.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">Qdrant HNSW: nearest chunks by</text><text x="262.0" y="345.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-a