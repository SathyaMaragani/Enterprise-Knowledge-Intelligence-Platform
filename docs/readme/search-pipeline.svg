ext-anchor="start" xml:space="preserve">query, mode, category,</text><text x="32.0" y="205.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">status, page</text><rect x="252.5" y="23.5" width="235.0" height="189.5" rx="10" fill="#0F172A" opacity="0.08"/><rect x="250.0" y="20.0" width="235.0" height="189.5" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/><path d="M250,55.5 V30 Q250,20 260,20 H475 Q485,20 485,30 V55.5 Z" fill="url(#g2)" stroke="#2563EB" stroke-width="0.1" stroke-linejoin="round" stroke-linecap="round"/><text x="262.0" y="45.3" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">Keyword leg</text><rect x="257.0" y="66.2" width="221.0" height="16.5" rx="3" fill="#FEF9C3"/><text x="262.0" y="78.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" font-weight="bold" xml:space="preserve">Modes: keyword, fuzzy, hybrid</text><text x="262.0" y="95.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">Title and description (PostgreSQL)</text><text x="262.0" y="112.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">and body text (MongoDB), scored by</text><text x="262.0" y="129.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">TextHack:</text><text x="262.0" y="146.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">• KMP: whole phrase</text><text x="262.0" y="163.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">• Aho-Corasick: all terms</text><text x="262.0" y="180.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">• Damerau-Levenshtein: typos</text><text x="262.0" y="197.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">• Prefixes: part-typed words</text><rect x="252.5" y="239.0" width="235.0" height="155.5" rx="10" fill="#0F172A" opacity="0.08"/><rect x="250.0" y="235.5" width="235.0" height="155.5" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/><path d="M250,271.0 V245.5 Q250,235.5 260,235.5 H475 Q485,235.5 485,245.5 V271.0 Z" fill="url(#g3)" stroke="#E11D48" stroke-width="0.1" stroke-linejoin="round" stroke-linecap="round"/><text x="262.0" y="260.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">Vector leg</text><rect x="257.0" y="281.8" width="221.0" height="16.5" rx="3" fill="#FEF9C3"/><text x="262.0" y="294.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" font-weight="bold" xml:space="preserve">Modes: semantic, hybrid</text><text x="262.0" y="311.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">MiniLM (ONNX) embeds the query,</text><text x="262.0" y="328.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">384-d</text><text x="262.0" y="345.2" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anc