" y="43.5" width="150.0" height="172.5" rx="10" fill="#0F172A" opacity="0.08"/><rect x="750.0" y="40.0" width="150.0" height="172.5" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/><path d="M750,75.5 V50 Q750,40 760,40 H890 Q900,40 900,50 V75.5 Z" fill="url(#g5)" stroke="#7C3AED" stroke-width="0.1" stroke-linejoin="round" stroke-linecap="round"/><text x="762.0" y="65.3" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">Fuse and hydrate</text><text x="762.0" y="98.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">score = the stronger</text><text x="762.0" y="115.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">of keyword and</text><text x="762.0" y="132.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">meaning, plus half the</text><text x="762.0" y="149.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">other's remainder</text><text x="762.0" y="166.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">Titles from</text><text x="762.0" y="183.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">PostgreSQL, best</text><text x="762.0" y="200.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" xml:space="preserve">chunk from MongoDB</text><path d="M192.0,173.8 L218.0,173.8 L218.0,114.8 L247.0,114.